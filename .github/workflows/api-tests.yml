name: API Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Run Ruff Linter
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check .

  test:
    name: Run Pytest Suite with Allure
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Allure CLI
        uses: simple-soft/allure-report-action@v1
        with:
          allure-version: '2.28.0'

      - name: Run tests in parallel
        run: |
          pytest -n 4 -v --tb=short --alluredir=allure-results
        env:
          BASE_URL: https://jsonplaceholder.typicode.com

      - name: Generate Allure report
        run: |
          allure generate allure-results --output allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          retention-days: 30

      - name: Check test status
        if: failure()
        run: |
          echo "Tests failed. Check the reports for details."
          exit 1
